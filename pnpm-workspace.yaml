packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  msgpackr-extract: true
# pnpm v11 reads overrides from this file (no longer from package.json `pnpm`).
# NativeWind v5 docs (Migrate from v4) require lightningcss pinned to 1.30.1 —
# newer lightningcss breaks parsing nativewind/theme.css's nested `@media ios`
# blocks with `failed to deserialize ... expected an object-like struct named
# Specifier, found ()`.
overrides:
  lightningcss: "1.30.1"
