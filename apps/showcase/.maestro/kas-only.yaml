# Focused KAS-only flow. Single deep link → screenshot. Used while debugging
# the KeyboardAvoidingScroll layout — avoids re-screenshotting the 4
# already-verified Header / TabBar / SearchBar / SegmentedControl pages.

appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: "exp://localhost:8081/--/"
- extendedWaitUntil:
    visible: "Application Screens"
    timeout: 60000

- openLink: "exp://localhost:8081/--/components/keyboard-avoiding-scroll"
- assertVisible:
    text: "KAS"
    enabled: true
- takeScreenshot: 01-kas-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 02-kas-mid
