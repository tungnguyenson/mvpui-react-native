# Drives the showcase through Badge / Avatar / List / Image / Skeleton.
# Wrapper `scripts/verify-batch3.sh` runs twice (light + dark) and
# renames captures to *-light.png / *-dark.png.
#
# Uses Expo deep links to bypass the restructured (tabs) nav.
#
# Preconditions:
#   1. `pnpm showcase:ios` is running.
#   2. Expo Go is foregrounded.
#
# Run:  pnpm verify:batch3

appId: host.exp.Exponent
---
# --- Cold-launch, wait for bundle -----------------------------------------
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: "exp://localhost:8081/--/"
- extendedWaitUntil:
    visible: "Application Screens"
    timeout: 60000
- takeScreenshot: 01-index

# ----- Badge ------------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/badge"
- assertVisible:
    text: "Badge"
    enabled: true
- takeScreenshot: 02-badge-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 03-badge-mid

# ----- Avatar -----------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/avatar"
- assertVisible:
    text: "Avatar"
    enabled: true
- takeScreenshot: 04-avatar-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 05-avatar-mid

# ----- List -------------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/list"
- assertVisible:
    text: "List"
    enabled: true
- takeScreenshot: 06-list-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 07-list-mid

# ----- Image ------------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/image"
- assertVisible:
    text: "Image"
    enabled: true
- takeScreenshot: 08-image-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 09-image-mid

# ----- Skeleton ---------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/skeleton"
- assertVisible:
    text: "Skeleton"
    enabled: true
- takeScreenshot: 10-skel-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 11-skel-mid
