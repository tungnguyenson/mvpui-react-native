# Focused Skeleton-only flow. Confirms SafeArea-edges fix.

appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: "exp://localhost:8081/--/"
- extendedWaitUntil:
    visible: "Application Screens"
    timeout: 60000

- openLink: "exp://localhost:8081/--/components/skeleton"
- assertVisible:
    text: "Skeleton"
    enabled: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-skel-top
