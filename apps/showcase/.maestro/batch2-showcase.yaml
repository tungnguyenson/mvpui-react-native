# Drives the showcase through Header / TabBar / SearchBar /
# SegmentedControl / KeyboardAvoidingScroll demos in a single sweep.
# Wrapper `scripts/verify-batch2.sh` runs this flow twice (light + dark)
# and renames captures to *-light.png / *-dark.png.
#
# Preconditions:
#   1. `pnpm showcase:ios` is running.
#   2. Expo Go is foregrounded.
#
# Run:  pnpm verify:batch2

appId: host.exp.Exponent
---
- runFlow:
    when:
      visible: "index"
    commands:
      - tapOn: "index"

- assertVisible: "mvp-ui-rn"
- takeScreenshot: 01-index

# ----- Header -----------------------------------------------------------
- tapOn: "Header"
- assertVisible:
    text: "Header"
    enabled: true
- takeScreenshot: 02-header-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 03-header-mid
- tapOn: "index"

# ----- TabBar -----------------------------------------------------------
- tapOn: "TabBar"
- assertVisible:
    text: "TabBar"
    enabled: true
- takeScreenshot: 04-tabbar-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 05-tabbar-mid
- tapOn: "index"

# ----- SearchBar --------------------------------------------------------
- tapOn: "SearchBar"
- assertVisible:
    text: "SearchBar"
    enabled: true
- takeScreenshot: 06-searchbar-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 07-searchbar-mid
- tapOn: "index"

# ----- SegmentedControl -------------------------------------------------
- tapOn: "SegmentedControl"
- assertVisible:
    text: "SegmentedControl"
    enabled: true
- takeScreenshot: 08-segmented-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 09-segmented-mid
- tapOn: "index"

# ----- KeyboardAvoidingScroll -------------------------------------------
- tapOn: "KAS"
- assertVisible:
    text: "KAS"
    enabled: true
- takeScreenshot: 10-kas-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 11-kas-mid
