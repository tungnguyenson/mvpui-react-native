# Drives the showcase through Header / TabBar / SearchBar /
# SegmentedControl / KeyboardAvoidingScroll demos in a single sweep.
# Wrapper `scripts/verify-batch2.sh` runs this flow twice (light + dark)
# and renames captures to *-light.png / *-dark.png.
#
# Uses Expo deep links to bypass the restructured (tabs) nav.
#
# Preconditions:
#   1. `pnpm showcase:ios` is running.
#   2. Expo Go is foregrounded.
#
# Run:  pnpm verify:batch2

appId: host.exp.Exponent
---
# --- Cold-launch, wait for bundle -----------------------------------------
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: "exp://localhost:8081/--/"
- extendedWaitUntil:
    visible: "Application Screens"
    timeout: 60000
- takeScreenshot: 01-index

# ----- Header -----------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/header"
- assertVisible:
    text: "Header"
    enabled: true
- takeScreenshot: 02-header-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 03-header-mid

# ----- TabBar -----------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/tab-bar"
- assertVisible:
    text: "TabBar"
    enabled: true
- takeScreenshot: 04-tabbar-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 05-tabbar-mid

# ----- SearchBar --------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/search-bar"
- assertVisible:
    text: "SearchBar"
    enabled: true
- takeScreenshot: 06-searchbar-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 07-searchbar-mid

# ----- SegmentedControl -------------------------------------------------
- openLink: "exp://localhost:8081/--/components/segmented-control"
- assertVisible:
    text: "SegmentedControl"
    enabled: true
- takeScreenshot: 08-segmented-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 09-segmented-mid

# ----- KeyboardAvoidingScroll -------------------------------------------
- openLink: "exp://localhost:8081/--/components/keyboard-avoiding-scroll"
- assertVisible:
    text: "KAS"
    enabled: true
- takeScreenshot: 10-kas-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 11-kas-mid
