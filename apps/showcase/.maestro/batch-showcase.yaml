# Drives the showcase app through Spinner / SafeArea / Card / Alert /
# EmptyState demos in a single sweep. Wrapper `scripts/verify-batch.sh`
# runs this flow TWICE — light + dark — and renames captures to
# *-light.png / *-dark.png between runs.
#
# Preconditions:
#   1. `pnpm showcase:ios` is running.
#   2. Expo Go is foregrounded.
#
# Run:  pnpm verify:batch

appId: host.exp.Exponent
---
# --- Reset to index if currently on a component page --------------------

- runFlow:
    when:
      visible: "index"
    commands:
      - tapOn: "index"

- assertVisible: "mvp-ui-rn"
- takeScreenshot: 01-index

# ----- Spinner ----------------------------------------------------------

- tapOn: "Spinner"
- assertVisible:
    text: "Spinner"
    enabled: true
- takeScreenshot: 02-spinner-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 03-spinner-mid
- tapOn: "index"

# ----- SafeArea ---------------------------------------------------------

- tapOn: "SafeArea"
- assertVisible:
    text: "SafeArea"
    enabled: true
- takeScreenshot: 04-safearea-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 05-safearea-mid
- tapOn: "index"

# ----- Card -------------------------------------------------------------

- tapOn: "Card"
- assertVisible:
    text: "Card"
    enabled: true
- takeScreenshot: 06-card-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 07-card-mid
- tapOn: "index"

# ----- Alert ------------------------------------------------------------

- tapOn: "Alert"
- assertVisible:
    text: "Alert"
    enabled: true
- takeScreenshot: 08-alert-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 09-alert-mid
- tapOn: "index"

# ----- EmptyState -------------------------------------------------------

- tapOn: "EmptyState"
- assertVisible:
    text: "EmptyState"
    enabled: true
- takeScreenshot: 10-empty-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 11-empty-mid
