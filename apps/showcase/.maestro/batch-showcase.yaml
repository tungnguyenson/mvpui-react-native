# Drives the showcase app through Spinner / SafeArea / Card / Alert /
# EmptyState demos in a single sweep. Wrapper `scripts/verify-batch.sh`
# runs this flow TWICE — light + dark — and renames captures to
# *-light.png / *-dark.png between runs.
#
# Uses Expo deep links to bypass the restructured (tabs) nav.
#
# Preconditions:
#   1. `pnpm showcase:ios` is running.
#   2. Expo Go is foregrounded.
#
# Run:  pnpm verify:batch

appId: host.exp.Exponent
---
# --- Cold-launch, wait for bundle -----------------------------------------
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: "exp://localhost:8081/--/"
- extendedWaitUntil:
    visible: "Application Screens"
    timeout: 60000
- takeScreenshot: 01-index

# ----- Spinner ----------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/spinner"
- assertVisible:
    text: "Spinner"
    enabled: true
- takeScreenshot: 02-spinner-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 03-spinner-mid

# ----- SafeArea ---------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/safe-area"
- assertVisible:
    text: "SafeArea"
    enabled: true
- takeScreenshot: 04-safearea-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 05-safearea-mid

# ----- Card -------------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/card"
- assertVisible:
    text: "Card"
    enabled: true
- takeScreenshot: 06-card-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 07-card-mid

# ----- Alert ------------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/alert"
- assertVisible:
    text: "Alert"
    enabled: true
- takeScreenshot: 08-alert-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 09-alert-mid

# ----- EmptyState -------------------------------------------------------
- openLink: "exp://localhost:8081/--/components/empty-state"
- assertVisible:
    text: "EmptyState"
    enabled: true
- takeScreenshot: 10-empty-top
- swipe:
    direction: UP
    duration: 2500
- takeScreenshot: 11-empty-mid
